name: CI

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show branch and files
        run: |
          echo "Branch: ${{ github.ref }}"
          git status
          ls -la
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: |
          corepack enable
          yarn --version || npm --version
          if [ -f yarn.lock ]; then yarn install --frozen-lockfile; else npm ci; fi
      - name: Lint
        run: |
          if [ -f package.json ]; then
            if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.lint ? 0 : 1)"; then
              if [ -f yarn.lock ]; then yarn lint; else npm run lint; fi
            else
              echo "No lint script; skipping"
            fi
          else
            echo "No package.json; skipping"
          fi
      - name: Build
        run: |
          if [ -f package.json ]; then
            if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.build ? 0 : 1)"; then
              if [ -f yarn.lock ]; then yarn build; else npm run build; fi
            else
              echo "No build script; skipping"
            fi
          else
            echo "No package.json; skipping"
          fi